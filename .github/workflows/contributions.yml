name: Refresh profile contributions

on:
  schedule:
    - cron: "27 2 * * *"
  push:
    paths:
      - scripts/contribution_art.py
      - .github/workflows/contributions.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-contributions

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build contribution charts
        run: python3 scripts/contribution_art.py
      - name: Commit updated assets
        run: |
          git add assets/contributions-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile contribution charts'
          git push
